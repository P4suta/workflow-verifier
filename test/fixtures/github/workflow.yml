name: pull request checks
on:
  pull_request:
permissions: write-all
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: compile
        run: echo "${{ github.event.pull_request.title }} ${{ secrets.BUILD_TOKEN }}"

[graph]
all-features = true

[advisories]
version = 2
ignore = []
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

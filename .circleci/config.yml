version: 2.1

jobs:
  verify:
    machine:
      image: default
    steps:
      - checkout
      - run:
          name: Build analyzer
          command: opam install . --deps-only --with-test --yes && opam exec -- dune build @all
      - run:
          name: Contract tests
          command: opam exec -- dune runtest --force
      - run:
          name: Fetch pinned yaml-test-suite
          command: python -B scripts/fetch_yaml_test_suite.py --allow-network
      - run:
          name: YAML conformance (402 cases)
          command: opam exec -- dune exec test/yaml_conformance.exe -- --suite _build/upstream/yaml-test-suite-canonical-data-2022-01-17
      - run:
          name: Tooling contracts
          command: python -B -m unittest discover -s scripts/tests -p 'test_*.py' -v && python -B scripts/verify_architecture.py
      - run:
          name: Native backend conformance
          command: cargo test --manifest-path helpers/Cargo.toml --workspace --all-targets
      - run:
          name: Native backend lint
          command: cargo fmt --manifest-path helpers/Cargo.toml --all -- --check && cargo clippy --manifest-path helpers/Cargo.toml --workspace --all-targets -- -D warnings

workflows:
  verify:
    jobs:
      - verify

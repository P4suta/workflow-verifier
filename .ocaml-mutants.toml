version = 1

[mutation]
profile = "balanced"
include = [
  "lib/foundation/json.ml",
  "lib/foundation/sha256.ml",
  "lib/foundation/dependency_identity.ml",
  "lib/syntax/**/*.ml",
  "lib/domain/abstract_value.ml",
  "lib/domain/condition.ml",
  "lib/verifier/**/*.ml",
  "lib/product/config.ml",
  "lib/product/policy.ml",
]
exclude = ["**/_build/**", "**/test/**", "**/tests/**"]

[test]
baseline_runs = 3
parallel_safe = false

[[test.stages]]
name = "algebraic-properties"
command = ["dune", "exec", "test/property_contract.exe"]

[[test.stages]]
name = "semantic-fingerprints"
command = ["dune", "build", "--force", "@@test/mutation-semantic-oracle"]

[[test.stages]]
name = "yaml-conformance"
command = ["dune", "build", "--force", "@@test/mutation-yaml-conformance"]

[[test.stages]]
name = "full-contracts"
command = ["dune", "runtest", "--force"]

[execution]
jobs = 1

[cache]
mode = "off"

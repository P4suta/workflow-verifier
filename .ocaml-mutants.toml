version = 1

[mutation]
profile = "balanced"
include = [
  "lib/foundation/json.ml",
  "lib/foundation/sha256.ml",
  "lib/foundation/dependency_identity.ml",
  "lib/syntax/**/*.ml",
  "lib/domain/abstract_value.ml",
  "lib/domain/condition.ml",
  "lib/verifier/**/*.ml",
  "lib/product/config.ml",
  "lib/product/policy.ml",
]
exclude = ["**/_build/**", "**/test/**", "**/tests/**"]

[test]
baseline_runs = 3
parallel_safe = false

[[test.stages]]
name = "algebraic-properties"
command = [
  "python3",
  "-B",
  "scripts/mutation_resource_guard.py",
  "--",
  "dune",
  "exec",
  "--jobs=1",
  "test/property_contract.exe",
]

[[test.stages]]
name = "semantic-fingerprints"
command = [
  "python3",
  "-B",
  "scripts/mutation_resource_guard.py",
  "--",
  "dune",
  "build",
  "--jobs=1",
  "--force",
  "@@test/mutation-semantic-oracle",
]

[[test.stages]]
name = "yaml-conformance"
command = [
  "python3",
  "-B",
  "scripts/mutation_resource_guard.py",
  "--",
  "dune",
  "build",
  "--jobs=1",
  "--force",
  "@@test/mutation-yaml-conformance",
]

[[test.stages]]
name = "full-contracts"
command = [
  "python3",
  "-B",
  "scripts/mutation_resource_guard.py",
  "--",
  "dune",
  "runtest",
  "--jobs=1",
  "--force",
]

[execution]
jobs = 1

[cache]
mode = "off"

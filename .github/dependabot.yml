version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps(actions)

  - package-ecosystem: cargo
    directory: /helpers
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns:
          - "*"
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps(rust)

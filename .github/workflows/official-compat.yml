name: Official project drift

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

concurrency:
  group: official-project-drift
  cancel-in-progress: false

jobs:
  latest-default-branches:
    name: Latest official default branches
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Build current analyzer
        run: cargo build --locked -p workflow-verifier
      - name: Observe current upstream default branches
        run: >-
          python -B scripts/fetch_official_projects.py
          --manifest official/official-projects-v1.json
          --destination _build/official-projects-latest
          --mode latest
      - name: Analyze drift without changing the pinned release gate
        run: >-
          python -B scripts/official_compat.py
          --manifest official/official-projects-v1.json
          --snapshots _build/official-projects-latest
          --analyzer target/debug/workflow-verifier
          --output _build/official-compat-latest.json
          --allow-latest
      - name: Upload drift observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-compat-latest
          path: |
            _build/official-projects-latest/acquisition-v1.json
            _build/official-compat-latest.json
          if-no-files-found: error

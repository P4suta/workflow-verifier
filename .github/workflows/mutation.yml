name: Mutation quality

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Install analyzer dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Install immutable mutation runner
        run: >-
          opam pin add ocaml-mutants.dev
          git+https://github.com/P4suta/ocaml-mutants.git#ff665225c110f8b71a40356bf69574b5c9a67413
          --yes
      - name: Fetch immutable YAML conformance oracle
        run: >-
          python -B scripts/fetch_yaml_test_suite.py --allow-network
          --destination _build/upstream/yaml-test-suite-data-2022-01-17
          --export-destination
          _build/upstream/yaml-test-suite-canonical-data-2022-01-17
      - name: Build the complete canonical mutant catalog
        id: plan
        shell: bash
        run: |
          mkdir -p _build
          opam exec -- ocaml-mutants list --json . > _build/mutation-catalog.json
          python -B scripts/verify_mutation_campaign.py plan \
            --manifest scripts/mutation-shards-v1.json \
            --config .ocaml-mutants.toml \
            --workspace . \
            --catalog _build/mutation-catalog.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload canonical catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-catalog
          path: _build/mutation-catalog.json
          if-no-files-found: error
      - name: Upload immutable YAML conformance oracle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaml-conformance-oracle
          path: _build/upstream/yaml-test-suite-canonical-data-2022-01-17
          if-no-files-found: error
          include-hidden-files: true

  shard:
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Install analyzer dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Install immutable mutation runner
        run: >-
          opam pin add ocaml-mutants.dev
          git+https://github.com/P4suta/ocaml-mutants.git#ff665225c110f8b71a40356bf69574b5c9a67413
          --yes
      - name: Download canonical catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-catalog
          path: _build/catalog
      - name: Download immutable YAML conformance oracle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yaml-conformance-oracle
          path: _build/upstream/yaml-test-suite-canonical-data-2022-01-17
      - name: Authenticate canonical YAML conformance oracle
        run: >-
          python -B scripts/fetch_yaml_test_suite.py --verify-export-only
          --export-destination
          _build/upstream/yaml-test-suite-canonical-data-2022-01-17
      - name: Run the complete catalog partition
        id: mutation-runner
        continue-on-error: true
        shell: bash
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
          WORKFLOW_VERIFIER_YAML_SUITE: ${{ github.workspace }}/_build/upstream/yaml-test-suite-canonical-data-2022-01-17
        run: |
          mkdir -p _build
          mapfile -t mutant_ids < <(python -B scripts/verify_mutation_campaign.py select \
            --manifest scripts/mutation-shards-v1.json \
            --config .ocaml-mutants.toml \
            --workspace . \
            --shard "$MUTATION_SHARD" \
            --field mutants \
            --catalog _build/catalog/mutation-catalog.json)
          test "${#mutant_ids[@]}" -gt 0
          arguments=()
          for mutant_id in "${mutant_ids[@]}"; do
            arguments+=(--mutant "$mutant_id")
          done
          set +e
          opam exec -- ocaml-mutants run --fresh --json --jobs=1 \
            "${arguments[@]}" . \
            > "_build/mutation-report-${MUTATION_SHARD}.json" &
          runner_pid=$!
          while kill -0 "$runner_pid" 2>/dev/null; do
            printf 'mutation heartbeat: shard=%s pid=%s\n' \
              "$MUTATION_SHARD" "$runner_pid"
            sleep 30
          done
          wait "$runner_pid"
          runner_exit_code=$?
          set -e
          printf '%s\n' "$runner_exit_code" \
            > "_build/mutation-runner-exit-${MUTATION_SHARD}.txt"
          exit "$runner_exit_code"
      - name: Reconcile shard report with the canonical catalog
        if: always()
        shell: bash
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          python -B scripts/verify_mutation_campaign.py verify-shard \
            --manifest scripts/mutation-shards-v1.json \
            --config .ocaml-mutants.toml \
            --workspace . \
            --catalog _build/catalog/mutation-catalog.json \
            --shard "$MUTATION_SHARD" \
            --report "_build/mutation-report-${MUTATION_SHARD}.json" \
            --runner-exit "_build/mutation-runner-exit-${MUTATION_SHARD}.txt" \
            --output "_build/mutation-gate-${MUTATION_SHARD}.json"
      - name: Upload complete shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            _build/mutation-report-${{ matrix.shard }}.json
            _build/mutation-gate-${{ matrix.shard }}.json
            _build/mutation-runner-exit-${{ matrix.shard }}.txt
          if-no-files-found: error

  aggregate:
    needs: [catalog, shard]
    if: ${{ always() && needs.catalog.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every catalog-bound shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: _build/mutation-evidence
          merge-multiple: true
      - name: Verify exact catalog union and aggregate evidence
        run: >-
          python -B scripts/verify_mutation_campaign.py aggregate
          --manifest scripts/mutation-shards-v1.json
          --config .ocaml-mutants.toml
          --workspace .
          --catalog _build/mutation-evidence/mutation-catalog.json
          --evidence-dir _build/mutation-evidence
          --output _build/mutation-evidence/mutation-campaign-v1.json
      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence
          path: _build/mutation-evidence
          if-no-files-found: error

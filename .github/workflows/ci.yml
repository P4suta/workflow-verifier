name: CI

on:
  workflow_call:
    inputs:
      performance_baseline:
        description: Exact revision used as the paired performance baseline
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NO_COLOR: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  task-surface:
    name: Pinned task surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Install Just 1.57.0 from its locked crate graph
        run: cargo install just --version 1.57.0 --locked
      - name: Parse and dry-run the public task surface
        run: python -B scripts/verify_task_surface.py

  static-quality:
    name: Format, lint, type, workflow, and documentation quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Install hash-locked Python quality tools
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Install checksum-pinned actionlint and ShellCheck
        shell: bash
        run: |
          quality_bin="$RUNNER_TEMP/quality-tools/bin"
          mkdir -p "$quality_bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$quality_bin" actionlint
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" \
            "$quality_bin/shellcheck"
          printf '%s\n' "$quality_bin" >> "$GITHUB_PATH"
      - name: Verify Python formatting, lint, and release-tool types
        run: |
          ruff check .
          ruff format --check .
          mypy \
            scripts/candidate_artifacts.py \
            scripts/generate_sbom.py \
            scripts/generate_release_index.py \
            scripts/promote_release_assets.py \
            scripts/stage_release_evidence.py \
            scripts/verify_release_evidence.py \
            scripts/verify_conformance_manifest.py \
            scripts/verify_linux_compat.py \
            scripts/verify_sarif.py \
            scripts/benchmark_fixture.py \
            scripts/measure_performance.py \
            scripts/measure_performance_pair.py \
            scripts/prepare_corpus.py \
            scripts/corpus_gate.py
          python -B -m unittest scripts.tests.test_verify_sarif -v
      - name: Verify OCaml formatting
        run: |
          opam install ocamlformat.0.28.1 --yes
          opam exec -- dune build @fmt
      - name: Audit GitHub Actions and embedded shell
        run: |
          test "$(actionlint -version | head -n 1)" = '1.7.12'
          shellcheck --version | grep --fixed-strings 'version: 0.11.0'
          actionlint -no-color
          zizmor --persona pedantic --no-progress .github/workflows
      - name: Verify Markdown links offline
        run: python -B scripts/verify_markdown_links.py --root .

  rust-security:
    name: Rust lock, advisory, license, and source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the release Rust toolchain
        run: rustc --version | grep --fixed-strings 'rustc 1.98.0'
      - name: Install exact locked security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Reject advisories, yanks, license drift, and unknown sources
        run: |
          cargo audit --file Cargo.lock --deny warnings
          cargo deny check

  rust-product:
    name: Rust product ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Test the complete Rust product and helper workspace
        run: cargo test --locked --workspace --all-targets
      - name: Enforce Rust formatting
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: cargo fmt --all -- --check
      - name: Enforce warning-free Rust
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Enforce release-mode LSP latency budgets
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: >-
          cargo test --release -p workflow-verifier-cli --lib
          lsp::performance_tests -- --ignored --nocapture --test-threads=1

  ocaml-reference:
    name: OCaml reference ${{ matrix.ocaml-compiler }} on ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ocaml-compiler: [5.4.0, 5.5.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install release-locked dependencies
        if: ${{ matrix.ocaml-compiler == '5.5.0' }}
        run: opam install . --deps-only --with-test --locked --yes
      - name: Install OCaml 5.4 compatibility-locked dependencies
        if: ${{ matrix.ocaml-compiler == '5.4.0' }}
        run: >-
          opam install . --deps-only --with-test --locked
          --lock-suffix=locked-ocaml54 --yes
      - name: Build
        run: opam exec -- dune build @all
      - name: Contract tests
        run: opam exec -- dune runtest --force
      - name: Fetch pinned yaml-test-suite
        run: python -B scripts/fetch_yaml_test_suite.py --allow-network
      - name: YAML conformance (402 cases)
        run: opam exec -- dune exec test/yaml_conformance.exe -- --suite _build/upstream/yaml-test-suite-canonical-data-2022-01-17
      - name: Tooling contracts
        run: python -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: License integrity
        run: python -B scripts/verify_licenses.py
      - name: Architecture boundary
        run: python -B scripts/verify_architecture.py
      - name: Pure OCaml boundary
        run: python -B scripts/verify_pure_ocaml.py
      - uses: ./.github/actions/setup-repository-rust
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.5.0' }}
      - name: Install surface
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.5.0' }}
        run: >-
          opam exec -- dune build @install &&
          cargo build --locked -p workflow-verifier-cli &&
          python -B scripts/verify_install_layout.py
          _build/install/default target/debug/workflow-verifier
      - name: Exercise the reference oracle
        run: >-
          opam exec -- dune exec workflow-verifier-reference -- check
          --config examples/dogfood-policy-v2.toml
          --trust-repository-config .

  native-helpers:
    name: Native helpers on ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and sign Virtualization.framework shim
        if: runner.os == 'macOS'
        run: sh helpers/macos/build-shim.sh
      - name: Backend conformance
        run: cargo test --manifest-path helpers/Cargo.toml --workspace --all-targets
      - name: Rust format
        run: cargo fmt --manifest-path helpers/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path helpers/Cargo.toml --workspace --all-targets -- -D warnings

  linux-native-containment:
    name: Linux native containment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attack fixtures in delegated cgroup v2
        run: |
          docker run --rm --privileged --cgroupns private \
            --env WORKFLOW_VERIFIER_REQUIRE_NATIVE_TESTS=1 \
            --mount type=bind,source="$PWD",target=/work \
            --workdir /work \
            rust:1.85-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4 sh -ec '
              mkdir /sys/fs/cgroup/workflow-verifier-harness
              while IFS= read -r process_id; do
                echo "$process_id" > /sys/fs/cgroup/workflow-verifier-harness/cgroup.procs
              done < /sys/fs/cgroup/cgroup.procs
              echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control
              mkdir /sys/fs/cgroup/workflow-verifier-delegated
              export WORKFLOW_VERIFIER_CGROUP_ROOT=/sys/fs/cgroup/workflow-verifier-delegated
              cargo test --locked --manifest-path helpers/Cargo.toml \
                -p workflow-verifier-linux-helper --all-targets -- --test-threads=1
            '

  live-dogfood:
    name: Live CLI and OCI dogfood
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Install hash-locked SARIF validator
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Build analyzer and isolated OCI adapter
        run: |
          cargo build --locked -p workflow-verifier-cli \
            -p workflow-verifier-oci-helper
      - name: Prepare immutable OCI fixture
        shell: bash
        run: |
          mkdir -p _dogfood _build/dogfood
          cp -R test/fixtures/sandbox-live _build/dogfood/sandbox
          image='rust:1.85-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4'
          docker pull "$image"
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          python -B scripts/dogfood_gate.py prepare-image \
            --config _build/dogfood/sandbox/.workflow-verifier.toml \
            --image "$image_id"
      - name: Exercise every public CLI surface and live Docker containment
        shell: bash
        env:
          WORKFLOW_VERIFIER_OCI_HELPER: ${{ github.workspace }}/target/debug/workflow-verifier-oci-helper
        run: |
          analyzer='target/debug/workflow-verifier'
          helper_sha256="$(sha256sum "$WORKFLOW_VERIFIER_OCI_HELPER" | cut -d' ' -f1)"
          export WORKFLOW_VERIFIER_OCI_HELPER_SHA256="sha256:${helper_sha256}"
          "$analyzer" check --config examples/dogfood-policy-v2.toml \
            --trust-repository-config --format json --output _dogfood/report.json .
          "$analyzer" check --config examples/dogfood-policy-v2.toml \
            --trust-repository-config --format sarif --output _dogfood/report.sarif.json .
          "$analyzer" explain WV-SUPPLY-001 test/fixtures/github/workflow.yml > _dogfood/explain.txt
          "$analyzer" graph --trust-repository-config --kind all --format json \
            test/fixtures/determinism > _dogfood/graph.json
          "$analyzer" graph --trust-repository-config --kind dataflow --format dot \
            test/fixtures/determinism > _dogfood/graph.dot
          "$analyzer" diff --trust-repository-config \
            test/fixtures/determinism test/fixtures/sandbox-live > _dogfood/diff.json
          "$analyzer" fix --trust-repository-config \
            test/fixtures/determinism > _dogfood/fix.patch
          "$analyzer" policy test --trust-repository-config \
            test/fixtures/dogfood-policy > _dogfood/policy.json
          "$analyzer" resolve --trust-repository-config \
            test/fixtures/determinism > _dogfood/lock.json
          "$analyzer" doctor --format json > _dogfood/doctor.json
          "$analyzer" sandbox plan --trust-repository-config \
            --backend oci:docker --job build _build/dogfood/sandbox > _dogfood/plan.json
          "$analyzer" sandbox run --trust-repository-config \
            --backend oci:docker --job build _build/dogfood/sandbox > _dogfood/run.json
          python -B scripts/dogfood_gate.py extract-evidence \
            --run _dogfood/run.json --output _dogfood/evidence.json
          "$analyzer" sandbox replay _dogfood/evidence.json > _dogfood/replay.json
          "$analyzer" sandbox audit --trust-repository-config \
            _dogfood/plan.json _dogfood/evidence.json \
            _build/dogfood/sandbox > _dogfood/audit.json
          python -B scripts/dogfood_gate.py verify \
            --root _dogfood --output _build/dogfood-v1.json
      - name: Validate SARIF against the digest-pinned OASIS 2.1.0 schema
        shell: bash
        run: |
          schema="$RUNNER_TEMP/sarif-schema-2.1.0.json"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$schema" \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
          printf '%s  %s\n' \
            c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e \
            "$schema" | sha256sum --check
          python -B scripts/verify_sarif.py \
            --schema "$schema" \
            --schema-digest \
            sha256:c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e \
            _dogfood/report.sarif.json
      - name: Upload content-addressed dogfood evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-evidence
          path: |
            _dogfood/*
            _build/dogfood-v1.json
          if-no-files-found: warn

  official-compat:
    name: Pinned official projects
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Build the analyzer
        run: cargo build --locked -p workflow-verifier-cli
      - name: Acquire only pinned upstream CI YAML
        run: >-
          python -B scripts/fetch_official_projects.py
          --manifest official/official-projects-v1.json
          --destination _build/official-projects
          --mode pinned
      - name: Analyze twice after acquisition with network-disabled resolver settings
        run: >-
          python -B scripts/official_compat.py
          --manifest official/official-projects-v1.json
          --snapshots _build/official-projects
          --analyzer target/debug/workflow-verifier
          --output _build/official-compat-v1.json
          --expected official/official-compat-v1.json
          --expected-digest official/official-compat-v1.sha256
      - name: Upload count-and-digest-only compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-compat-v1
          path: _build/official-compat-v1.json
          if-no-files-found: error

  performance-regression:
    name: OCaml performance ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Check out the comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: _performance-base
          ref: ${{ inputs.performance_baseline || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || github.sha }}
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Install and build baseline and head analyzers
        run: |
          opam install . --deps-only --with-test --locked --yes
          opam exec -- dune build --root _performance-base bin/main.exe
          opam exec -- dune build bin/main.exe
      - name: Install the measured workload driver in the baseline tree
        shell: bash
        run: |
          mkdir -p _performance-base/scripts
          cp scripts/benchmark_fixture.py _performance-base/scripts/benchmark_fixture.py
      - name: Period-balance identical workloads
        shell: bash
        env:
          PERFORMANCE_PLATFORM: ${{ matrix.platform }}
          WORKFLOW_VERIFIER_PERFORMANCE_PLATFORM: ${{ matrix.platform }}
        run: |
          base_revision=$(git -C _performance-base rev-parse HEAD)
          head_revision=$(git rev-parse HEAD)
          mkdir -p "_performance-evidence/ocaml/${PERFORMANCE_PLATFORM}"
          python -B scripts/measure_performance_pair.py \
            --suite performance/suite-v1.json \
            --baseline-workspace _performance-base \
            --baseline-revision "$base_revision" \
            --current-workspace . \
            --current-revision "$head_revision" \
            --samples 24 \
            --output-dir "_performance-evidence/ocaml/${PERFORMANCE_PLATFORM}"
          python -B scripts/performance_gate.py \
            --baseline "_performance-evidence/ocaml/${PERFORMANCE_PLATFORM}/baseline.json" \
            --current "_performance-evidence/ocaml/${PERFORMANCE_PLATFORM}/current.json" \
            --output "_performance-evidence/ocaml/${PERFORMANCE_PLATFORM}/comparison.json"
      - name: Upload exact performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-ocaml-${{ matrix.platform }}
          path: _performance-evidence/ocaml/${{ matrix.platform }}/*
          if-no-files-found: warn

  rust-performance-regression:
    name: Rust performance ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Check out the comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: _performance-base
          ref: ${{ inputs.performance_baseline || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || github.sha }}
      - uses: ./.github/actions/setup-repository-rust
      - name: Build release Rust baseline and head analyzers
        shell: bash
        run: |
          base_revision=$(git -C _performance-base rev-parse HEAD)
          head_revision=$(git rev-parse HEAD)
          WORKFLOW_VERIFIER_SOURCE_COMMIT="$base_revision" \
            cargo build --locked --release \
            --manifest-path _performance-base/Cargo.toml \
            -p workflow-verifier-cli
          WORKFLOW_VERIFIER_SOURCE_COMMIT="$head_revision" \
            cargo build --locked --release -p workflow-verifier-cli
      - name: Install the measured workload driver in the baseline tree
        shell: bash
        run: |
          mkdir -p _performance-base/scripts
          cp scripts/benchmark_fixture.py _performance-base/scripts/benchmark_fixture.py
      - name: Period-balance identical Rust workloads
        shell: bash
        env:
          PERFORMANCE_PLATFORM: ${{ matrix.platform }}
          WORKFLOW_VERIFIER_PERFORMANCE_PLATFORM: ${{ matrix.platform }}
        run: |
          base_revision=$(git -C _performance-base rev-parse HEAD)
          head_revision=$(git rev-parse HEAD)
          mkdir -p "_performance-evidence/rust/${PERFORMANCE_PLATFORM}"
          python -B scripts/measure_performance_pair.py \
            --suite performance/rust-suite-v1.json \
            --baseline-workspace _performance-base \
            --baseline-revision "$base_revision" \
            --current-workspace . \
            --current-revision "$head_revision" \
            --samples 24 \
            --output-dir "_performance-evidence/rust/${PERFORMANCE_PLATFORM}"
          python -B scripts/performance_gate.py \
            --baseline "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/baseline.json" \
            --current "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/current.json" \
            --output "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/comparison.json"
      - name: Upload exact Rust performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-rust-${{ matrix.platform }}
          path: _performance-evidence/rust/${{ matrix.platform }}/*
          if-no-files-found: warn

  coverage-guided-yaml-fuzz:
    name: Coverage-guided YAML fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Install analyzer and AFL++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends afl++
          opam install . --deps-only --with-test --locked --yes
      - name: Build AFL-instrumented pure OCaml parser
        run: opam exec -- dune build --profile afl test/yaml_fuzz.exe
      - name: Coverage-guided malformed-input campaign
        run: |
          python -B scripts/run_afl_fuzz.py \
            --seeds fuzz/corpus/yaml \
            --output _build/afl-results \
            --target _build/default/test/yaml_fuzz.exe \
            --seconds 60 \
            --memory-mb 1024

  determinism-probe:
    name: Determinism ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Build the Rust analyzer with candidate provenance
        env:
          WORKFLOW_VERIFIER_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo build --locked -p workflow-verifier-cli
      - name: Generate twice-local canonical comparison artifacts
        shell: bash
        env:
          DETERMINISM_PLATFORM: ${{ matrix.platform }}
        run: |
          analyzer=target/debug/workflow-verifier
          if [[ $DETERMINISM_PLATFORM == windows-x86_64 ]]; then
            analyzer=target/debug/workflow-verifier.exe
          fi
          python -B scripts/determinism_probe.py \
            --analyzer "$analyzer" \
            --fixture test/fixtures/determinism \
            --output "_build/determinism/$DETERMINISM_PLATFORM"
      - name: Upload exact comparison artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ matrix.platform }}
          path: _build/determinism/${{ matrix.platform }}/*
          if-no-files-found: error

  determinism-compare:
    name: Compare determinism artifacts
    needs: determinism-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Download platform artifacts without merging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: determinism-*
          path: _determinism
      - name: Require portable bytes and platform-neutral report semantics
        run: >-
          python -B scripts/compare_determinism.py
          --output _determinism/comparison.json
          _determinism/determinism-linux-arm64
          _determinism/determinism-linux-x86_64
          _determinism/determinism-windows-x86_64
          _determinism/determinism-macos-arm64
          _determinism/determinism-macos-x86_64

  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - task-surface
      - static-quality
      - rust-security
      - rust-product
      - ocaml-reference
      - native-helpers
      - linux-native-containment
      - live-dogfood
      - official-compat
      - performance-regression
      - rust-performance-regression
      - coverage-guided-yaml-fuzz
      - determinism-probe
      - determinism-compare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'dependency results: %s\n' "$RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*) exit 1 ;;
          esac

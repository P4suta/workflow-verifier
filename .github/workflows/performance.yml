name: Performance quality

on:
  workflow_call:
    inputs:
      performance_baseline:
        description: Exact revision used as the paired performance baseline
        required: true
        type: string

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  rust-performance-regression:
    name: Rust performance ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.15.0'
          check-latest: false
      - name: Check out the comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: _performance-base
          ref: ${{ inputs.performance_baseline }}
      - uses: ./.github/actions/setup-repository-rust
      - name: Build release Rust baseline and head analyzers
        shell: bash
        run: |
          base_revision=$(git -C _performance-base rev-parse HEAD)
          head_revision=$(git rev-parse HEAD)
          WORKFLOW_VERIFIER_SOURCE_COMMIT="$base_revision" \
            cargo build --locked --release \
            --manifest-path _performance-base/Cargo.toml \
            --bin workflow-verifier
          WORKFLOW_VERIFIER_SOURCE_COMMIT="$head_revision" \
            cargo build --locked --release -p workflow-verifier
      - name: Install the measured workload driver in the baseline tree
        shell: bash
        run: |
          mkdir -p _performance-base/scripts
          cp scripts/benchmark_fixture.py _performance-base/scripts/benchmark_fixture.py
          cp scripts/lsp_benchmark.py _performance-base/scripts/lsp_benchmark.py
      - name: Period-balance identical Rust workloads
        shell: bash
        env:
          PERFORMANCE_PLATFORM: ${{ matrix.platform }}
          WORKFLOW_VERIFIER_PERFORMANCE_PLATFORM: ${{ matrix.platform }}
        run: |
          base_revision=$(git -C _performance-base rev-parse HEAD)
          head_revision=$(git rev-parse HEAD)
          mkdir -p "_performance-evidence/rust/${PERFORMANCE_PLATFORM}"
          python -B scripts/measure_performance_pair.py \
            --suite performance/rust-suite-v2.json \
            --baseline-workspace _performance-base \
            --baseline-revision "$base_revision" \
            --current-workspace . \
            --current-revision "$head_revision" \
            --samples 24 \
            --output-dir "_performance-evidence/rust/${PERFORMANCE_PLATFORM}"
          python -B scripts/performance_gate.py \
            --baseline "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/baseline.json" \
            --current "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/current.json" \
            --output "_performance-evidence/rust/${PERFORMANCE_PLATFORM}/comparison.json"
      - name: Upload exact Rust performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-rust-${{ matrix.platform }}
          path: _performance-evidence/rust/${{ matrix.platform }}/*
          if-no-files-found: warn

name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    permissions:
      contents: read
      id-token: write # Exchange this job's workload identity for its Doppler config.
    name: Create or update the draft Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-pr
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: workflow-verifier
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint a repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the complete main history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or update a draft Release PR only
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

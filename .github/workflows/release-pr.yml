name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    if: >-
      github.repository_id == '1343470774' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read # Check out reviewed main without a write token.
    name: Create or update the draft Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-pr
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - name: Mint a repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: workflow-verifier
          permission-contents: write
          permission-pull-requests: write
      - name: Check out the complete main history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or update a draft Release PR only
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

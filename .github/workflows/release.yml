name: Release Candidate Assembly and Protected Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Planned tag to validate and publish after protected approval
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release_evidence:
    name: Verify candidate C and evidence-only child E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attestation: ${{ steps.evidence.outputs.attestation }}
      signature: ${{ steps.evidence.outputs.signature }}
      subject_commit: ${{ steps.evidence.outputs.subject_commit }}
      crate_digest: ${{ steps.evidence.outputs.crate_digest }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Install patched pinned Cosign for offline bundle verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify exact v4 evidence, digests, gates, and maintainer signature
        id: evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          python -B scripts/verify_release_evidence.py
          --manifest release-evidence/release-evidence-v4.json
          --revision "$GITHUB_SHA"
          --tag "$RELEASE_TAG"
          --repository .
          --github-output "$GITHUB_OUTPUT"

  quality:
    needs: release_evidence
    uses: ./.github/workflows/ci.yml
    with:
      performance_baseline: ${{ needs.release_evidence.outputs.subject_commit }}
    permissions:
      contents: read

  mutation:
    needs: release_evidence
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read

  assemble:
    name: Promote exact verified assets without rebuilding
    needs: [release_evidence, mutation, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Verify release identity
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(python -B scripts/verify_release_version.py --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stage every digest-checked v4 reference
        run: >-
          python -B scripts/stage_release_evidence.py
          --manifest release-evidence/release-evidence-v4.json
          --destination _release/staged
      - name: Create public assets and deterministic evidence bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python -B scripts/promote_release_assets.py             --staged _release/staged             --output dist             --version "$RELEASE_VERSION"
          cp docs/release-notes-v0.1.0.md dist/release-notes-v0.1.0.md
          python -B scripts/generate_release_index.py             --root dist             --index dist/release-index-v1.json             --checksums dist/SHA256SUMS             --tag "$RELEASE_TAG"
      - name: Upload promotion-only release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish_crate:
    name: Publish the commit-bound crates.io package
    needs: [assemble, mutation, quality, release_evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crate-publication
    permissions:
      contents: read
    steps:
      - name: Check out candidate C, never evidence commit E
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_evidence.outputs.subject_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - uses: ./.github/actions/setup-repository-rust
      - name: Regenerate the crate twice and match signed release evidence
        id: package
        shell: bash
        env:
          CANDIDATE: ${{ needs.release_evidence.outputs.subject_commit }}
          EXPECTED_DIGEST: ${{ needs.release_evidence.outputs.crate_digest }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          version=$(python -B scripts/verify_release_version.py --tag "$RELEASE_TAG")
          digest=$(python -B scripts/package_crate.py \
            --repository . \
            --subject-commit "$CANDIDATE" \
            --version "$version" \
            --output "_crate/workflow-verifier-$version.crate" \
            --evidence _crate/crate-package-v1.json)
          test "$digest" = "$EXPECTED_DIGEST"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish once, or prove an identical prior publication
        shell: bash
        env:
          CANDIDATE: ${{ needs.release_evidence.outputs.subject_commit }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EXPECTED_DIGEST: ${{ needs.release_evidence.outputs.crate_digest }}
          VERSION: ${{ steps.package.outputs.version }}
        # crates.io cannot configure a trusted publisher before a crate's first
        # version; this bootstrap-only job refuses a different later version.
        # zizmor: ignore[use-trusted-publishing]
        run: |
          set -euo pipefail
          user_agent="workflow-verifier-release/$VERSION"
          version_url="https://crates.io/api/v1/crates/workflow-verifier/$VERSION"
          crate_url="https://crates.io/api/v1/crates/workflow-verifier/$VERSION/download"
          registry_crate="$RUNNER_TEMP/workflow-verifier-$VERSION.crate"

          status=$(curl --silent --show-error --location \
            --user-agent "$user_agent" --output "$RUNNER_TEMP/version-metadata.json" \
            --write-out '%{http_code}' "$version_url")
          if [[ "$status" == 200 ]]; then
            download_status=$(curl --silent --show-error --location \
              --user-agent "$user_agent" --output "$registry_crate" \
              --write-out '%{http_code}' "$crate_url")
            test "$download_status" = 200
            actual="sha256:$(sha256sum "$registry_crate" | cut -d' ' -f1)"
            if [[ "$actual" != "$EXPECTED_DIGEST" ]]; then
              echo "published version digest differs: $actual" >&2
              exit 1
            fi
          elif [[ "$status" == 404 ]]; then
            metadata_status=$(curl --silent --show-error --location \
              --user-agent "$user_agent" --output "$RUNNER_TEMP/crate-metadata.json" \
              --write-out '%{http_code}' \
              https://crates.io/api/v1/crates/workflow-verifier)
            if [[ "$metadata_status" == 200 ]]; then
              echo 'crate name was acquired without the candidate version; refusing to rename or publish' >&2
              exit 1
            fi
            if [[ "$metadata_status" != 404 ]]; then
              echo "unexpected crates.io metadata response: $metadata_status" >&2
              exit 1
            fi
            cargo publish --locked -p workflow-verifier
          else
            echo "unexpected crates.io download response: $status" >&2
            exit 1
          fi

          matched=false
          for _attempt in {1..12}; do
            status=$(curl --silent --show-error --location \
              --user-agent "$user_agent" --output "$RUNNER_TEMP/version-metadata.json" \
              --write-out '%{http_code}' "$version_url")
            if [[ "$status" == 200 ]]; then
              download_status=$(curl --silent --show-error --location \
                --user-agent "$user_agent" --output "$registry_crate" \
                --write-out '%{http_code}' "$crate_url")
              test "$download_status" = 200
              actual="sha256:$(sha256sum "$registry_crate" | cut -d' ' -f1)"
              if [[ "$actual" != "$EXPECTED_DIGEST" ]]; then
                echo "registry digest differs after publication: $actual" >&2
                exit 1
              fi
              matched=true
              break
            fi
            sleep 5
          done
          test "$matched" = true

          installed=false
          for _attempt in {1..6}; do
            if cargo install --locked --force --version "$VERSION" workflow-verifier \
              --root "$RUNNER_TEMP/registry-install"; then
              installed=true
              break
            fi
            sleep 10
          done
          test "$installed" = true
          analyzer="$RUNNER_TEMP/registry-install/bin/workflow-verifier"
          test "$("$analyzer" version)" = "workflow-verifier $VERSION"
          cp -R test/fixtures/crate-install-smoke "$RUNNER_TEMP/crate-smoke"
          "$analyzer" check --format json \
            --output "$RUNNER_TEMP/crate-smoke/report.json" \
            "$RUNNER_TEMP/crate-smoke"
          python - "$RUNNER_TEMP/crate-smoke/report.json" "$CANDIDATE" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["schema"] == "workflow-verifier-report/1"
          assert report["tool"]["commit"] == sys.argv[2]
          PY

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  mutation:
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read

  release_evidence:
    name: Verify externally reviewed release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bundle: ${{ steps.evidence.outputs.bundle }}
      report: ${{ steps.evidence.outputs.report }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify digest-bound corpus, performance, and review evidence
        id: evidence
        shell: bash
        run: >-
          python -B scripts/verify_release_evidence.py
          --manifest release-evidence/release-evidence-v1.json
          --revision "$GITHUB_SHA"
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify independent review signature
        working-directory: release-evidence
        shell: bash
        env:
          REVIEW_BUNDLE: ${{ steps.evidence.outputs.bundle }}
          REVIEW_IDENTITY: ${{ steps.evidence.outputs.identity }}
          REVIEW_ISSUER: ${{ steps.evidence.outputs.issuer }}
          REVIEW_REPORT: ${{ steps.evidence.outputs.report }}
        run: >-
          cosign verify-blob
          --bundle "$REVIEW_BUNDLE"
          --certificate-identity "$REVIEW_IDENTITY"
          --certificate-oidc-issuer "$REVIEW_ISSUER"
          "$REVIEW_REPORT"

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            analyzer: _build/install/default/bin/workflow-verifier
            oci: helpers/target/release/workflow-verifier-oci-helper
            native: helpers/target/release/workflow-verifier-linux-helper
            native_name: workflow-verifier-linux-helper
            archive: .tar.gz
          - os: windows-2025
            platform: windows-x86_64
            analyzer: _build/install/default/bin/workflow-verifier.exe
            oci: helpers/target/release/workflow-verifier-oci-helper.exe
            native: helpers/target/release/workflow-verifier-windows-helper.exe
            native_name: workflow-verifier-windows-helper.exe
            archive: .zip
          - os: macos-15
            platform: macos-arm64
            analyzer: _build/install/default/bin/workflow-verifier
            oci: helpers/target/release/workflow-verifier-oci-helper
            native: helpers/target/release/workflow-verifier-macos-helper
            native_name: workflow-verifier-macos-helper
            archive: .tar.gz
          - os: macos-15-intel
            platform: macos-x86_64
            analyzer: _build/install/default/bin/workflow-verifier
            oci: helpers/target/release/workflow-verifier-oci-helper
            native: helpers/target/release/workflow-verifier-macos-helper
            native_name: workflow-verifier-macos-helper
            archive: .tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: 5.5.0
      - name: Verify release identity
        id: version
        shell: bash
        run: |
          version=$(python -B scripts/verify_release_version.py --tag "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install analyzer dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build and test analyzer
        run: opam exec -- dune build @install @runtest --force
      - name: Build and test containment helpers
        run: |
          cargo test --locked --manifest-path helpers/Cargo.toml --workspace --all-targets
          cargo build --locked --release --manifest-path helpers/Cargo.toml --workspace
      - name: Build ad-hoc code-signed macOS VM shim
        if: runner.os == 'macOS'
        shell: bash
        run: sh helpers/macos/build-shim.sh _release/workflow-verifier-vm-shim
      - name: Create deterministic release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          ANALYZER_PATH: ${{ matrix.analyzer }}
          OCI_HELPER_PATH: ${{ matrix.oci }}
          NATIVE_HELPER_PATH: ${{ matrix.native }}
          NATIVE_HELPER_NAME: ${{ matrix.native_name }}
        run: |
          files=(
            --file "bin/workflow-verifier${ANALYZER_PATH##*workflow-verifier}=$ANALYZER_PATH"
            --file "bin/workflow-verifier-oci-helper${OCI_HELPER_PATH##*workflow-verifier-oci-helper}=$OCI_HELPER_PATH"
            --file "bin/$NATIVE_HELPER_NAME=$NATIVE_HELPER_PATH"
            --file "schema/config-v1.schema.json=schema/config-v1.schema.json"
            --file "schema/report-v1.schema.json=schema/report-v1.schema.json"
            --file "LICENSE-MIT=LICENSE-MIT"
            --file "LICENSE-APACHE=LICENSE-APACHE"
            --file "README.md=README.md"
          )
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            files+=(--file "bin/workflow-verifier-vm-shim=_release/workflow-verifier-vm-shim")
          fi
          python -B scripts/package_release.py \
            --platform "$RELEASE_PLATFORM" \
            --version "$RELEASE_VERSION" \
            --output "dist/workflow-verifier-$RELEASE_VERSION-$RELEASE_PLATFORM$RELEASE_ARCHIVE" \
            "${files[@]}"
      - name: Upload immutable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Sign, attest, and publish
    needs: [build, mutation, quality, release_evidence]
    if: github.ref_protected == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release identity
        id: version
        shell: bash
        run: |
          version=$(python -B scripts/verify_release_version.py --tag "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download immutable packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Stage validated independent review evidence
        shell: bash
        env:
          REVIEW_BUNDLE: ${{ needs.release_evidence.outputs.bundle }}
          REVIEW_REPORT: ${{ needs.release_evidence.outputs.report }}
        run: |
          cp -- "release-evidence/$REVIEW_REPORT" dist/independent-security-review.pdf
          cp -- "release-evidence/$REVIEW_BUNDLE" dist/independent-security-review.pdf.sigstore.json
          cp -- release-evidence/release-evidence-v1.json dist/release-evidence-v1.json
      - name: Generate deterministic SBOM and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t packages < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | LC_ALL=C sort)
          test "${#packages[@]}" -eq 4
          evidence=(
            dist/independent-security-review.pdf
            dist/independent-security-review.pdf.sigstore.json
            dist/release-evidence-v1.json
          )
          python -B scripts/generate_sbom.py \
            --version "$RELEASE_VERSION" \
            --output dist/workflow-verifier.spdx.json \
            --checksums dist/SHA256SUMS \
            "${packages[@]}" "${evidence[@]}"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign checksum manifest with keyless Sigstore identity
        shell: bash
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/workflow-verifier.spdx.json
      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes "${prerelease[@]}"

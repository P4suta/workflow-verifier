name: Release Candidate Assembly (Publication Disabled)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Planned tag to validate without publishing
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release_evidence:
    name: Verify candidate C and evidence-only child E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attestation: ${{ steps.evidence.outputs.attestation }}
      signature: ${{ steps.evidence.outputs.signature }}
      subject_commit: ${{ steps.evidence.outputs.subject_commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Install patched pinned Cosign for offline bundle verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify exact v4 evidence, digests, gates, and maintainer signature
        id: evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          python -B scripts/verify_release_evidence.py
          --manifest release-evidence/release-evidence-v4.json
          --revision "$GITHUB_SHA"
          --tag "$RELEASE_TAG"
          --repository .
          --github-output "$GITHUB_OUTPUT"

  quality:
    needs: release_evidence
    uses: ./.github/workflows/ci.yml
    with:
      performance_baseline: ${{ needs.release_evidence.outputs.subject_commit }}
    permissions:
      contents: read

  mutation:
    needs: release_evidence
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read

  assemble:
    name: Promote exact verified assets without rebuilding
    needs: [release_evidence, mutation, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Verify release identity
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(python -B scripts/verify_release_version.py --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stage every digest-checked v4 reference
        run: >-
          python -B scripts/stage_release_evidence.py
          --manifest release-evidence/release-evidence-v4.json
          --destination _release/staged
      - name: Create public assets and deterministic evidence bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python -B scripts/promote_release_assets.py             --staged _release/staged             --output dist             --version "$RELEASE_VERSION"
          cp docs/release-notes-v0.1.0.md dist/release-notes-v0.1.0.md
          python -B scripts/generate_release_index.py             --root dist             --index dist/release-index-v1.json             --checksums dist/SHA256SUMS             --tag "$RELEASE_TAG"
      - name: Upload promotion-only release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publication_disabled:
    name: Confirm publication remains disabled
    needs: [assemble, mutation, quality, release_evidence]
    # Enabling publication requires a separate reviewed source change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Preserve the explicit approval boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

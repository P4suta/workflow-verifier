name: Set up repository Rust toolchain
description: Install the exact toolchain and components declared by rust-toolchain.toml.

runs:
  using: composite
  steps:
    - name: Install the repository-pinned Rust toolchain
      shell: bash
      env:
        RUSTUP_BOOTSTRAP_VERSION: '1.29.0'
        # Published at https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init.sha256
        RUSTUP_BOOTSTRAP_SHA256_X86_64: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
        # Published at https://static.rust-lang.org/rustup/archive/1.29.0/aarch64-unknown-linux-gnu/rustup-init.sha256
        RUSTUP_BOOTSTRAP_SHA256_AARCH64: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64)
              RUSTUP_BOOTSTRAP_TARGET=x86_64-unknown-linux-gnu
              RUSTUP_BOOTSTRAP_SHA256=$RUSTUP_BOOTSTRAP_SHA256_X86_64
              ;;
            Linux:aarch64)
              RUSTUP_BOOTSTRAP_TARGET=aarch64-unknown-linux-gnu
              RUSTUP_BOOTSTRAP_SHA256=$RUSTUP_BOOTSTRAP_SHA256_AARCH64
              ;;
            *)
              echo 'rustup is absent and no checksum-pinned bootstrap is defined for this runner' >&2
              exit 1
              ;;
          esac
          rustup_init="$RUNNER_TEMP/rustup-init"
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            --output "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_BOOTSTRAP_VERSION/$RUSTUP_BOOTSTRAP_TARGET/rustup-init"
          printf '%s  %s\n' "$RUSTUP_BOOTSTRAP_SHA256" "$rustup_init" | sha256sum --check
          chmod 0700 "$rustup_init"
          "$rustup_init" --default-toolchain none --no-modify-path --profile minimal -y
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          export PATH="$cargo_bin:$PATH"
        fi
        rustup set auto-self-update disable
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        rustc --version --verbose
        cargo --version --verbose

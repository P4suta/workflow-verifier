[package]
name = "workflow-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Offline-first semantic verifier and isolated execution planner for CI workflows"
repository = "https://github.com/P4suta/workflow-verifier"
homepage = "https://github.com/P4suta/workflow-verifier"
documentation = "https://docs.rs/workflow-verifier"
readme = "README.md"
keywords = ["ci", "security", "workflow", "static-analysis", "sandbox"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]
build = "build.rs"
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/build.rs",
  "/src/**/*.rs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[workspace]
resolver = "3"
members = [
  ".",
  "crates/conformance",
  "helpers/oci",
  "helpers/linux",
  "helpers/windows",
  "helpers/macos",
  "helpers/vm-agent",
  "helpers/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
publish = false

[features]
default = ["cli"]
# Private release-bundle helpers compile only the versioned wire protocol and
# common process/runtime support from this package.
internal-support = ["dep:same-file"]
# The private differential comparator needs canonical foundation primitives,
# but none of the CLI/application adapters.
conformance-support = ["dep:caseless", "dep:sha2", "dep:unicode-normalization"]
cli = [
  "internal-support",
  "conformance-support",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:serde",
  "dep:serde_json",
  "dep:toml",
  "dep:url",
  "dep:zeroize",
]

[dependencies]
caseless = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
same-file = { version = "=1.0.6", optional = true }

[[bin]]
name = "workflow-verifier"
path = "src/main.rs"
required-features = ["cli"]

[workspace.dependencies]
caseless = "=0.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
toml = "=1.1.4"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
rustls = { version = "=0.23.43", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "=0.8.3"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "deny"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.mutants]
inherits = "test"
debug = "none"

name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project dependencies
        run: dotnet restore ./LlamaFleece.Tests/LlamaFleece.Tests.csproj

      - name: Build app in Release
        run: dotnet build ./LlamaFleece/LlamaFleece.csproj --configuration Release --no-restore

      - name: Run full test suite in Release
        run: dotnet test ./LlamaFleece.Tests/LlamaFleece.Tests.csproj --configuration Release --no-restore
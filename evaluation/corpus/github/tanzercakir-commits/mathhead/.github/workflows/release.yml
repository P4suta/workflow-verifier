name: Release
# Tag-triggered release. Build on a clean runner, validate, then publish to PyPI via
# TRUSTED PUBLISHING (OIDC) — no long-lived API token stored anywhere.
#
# One-time setup by the maintainer (see RELEASING.md):
#   1) On PyPI: add a Trusted Publisher for this repo (workflow: release.yml, env: pypi).
#   2) On GitHub: create an environment named `pypi` (optionally with required reviewers).
# Then: bump the version, tag `vX.Y.Z`, push the tag — this workflow does the rest.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/rel
          /tmp/rel/bin/pip install dist/*.whl
          /tmp/rel/bin/mathhead --version
          /tmp/rel/bin/mathhead entail -p "p" -p "implies(p, q)" -c "q"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC — this is what authorizes the trusted publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

name: Dart

# on:
#   push:
#     branches: [ "master" ]
#   pull_request:
#     branches: [ "master" ]
on: [push, pull_request]

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Set up Dart
      uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      with:
        sdk: "stable"

    - name: Install dependencies
      run: dart pub get

    - name: Run tests
      run: dart test

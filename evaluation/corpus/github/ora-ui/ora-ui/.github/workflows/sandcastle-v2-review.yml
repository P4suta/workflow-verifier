name: sandcastle-v2-review

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 */12 * * *'
  # pull_request:
  #   types: [synchronize]

concurrency:
  group: sandcastle-v2-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # if: github.event_name != 'pull_request' || (github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'agent-review-pending'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          token: ${{ secrets.SANDCASTLE_BOT_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20.x
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `pnpm sandcastle` invokes `tsx --env-file=.sandcastle/.env`, which
      # errors on a missing file. The file is gitignored (local secrets);
      # in CI all env vars come from the workflow env block, so an empty
      # file is sufficient to satisfy Node. Follow-up: switch to
      # `--env-file-if-exists` once CI Node bumps to 22+.
      - name: Stub .sandcastle/.env for tsx --env-file
        run: touch .sandcastle/.env

      # Sandcastle resolves the image name from the repo directory name
      # (defaultImageName in @ai-hero/sandcastle/mountUtils) — for this repo
      # that is `sandcastle:ora-ui`. Locally the image is cached after the
      # first build; in CI we rebuild each run. Cache optimization deferred.
      - name: Build sandcastle Docker image
        run: docker build -t sandcastle:ora-ui -f .sandcastle/Dockerfile .sandcastle

      - name: Run review dispatch
        env:
          GH_TOKEN: ${{ secrets.SANDCASTLE_BOT_TOKEN }}
          SANDCASTLE_BOT_LOGIN: ora-gh-bot
          # Agent selection — set vars.SANDCASTLE_REVIEWER_AGENT to override
          # the orchestrator's fallback (pi:anthropic/claude-sonnet-4-6).
          SANDCASTLE_REVIEWER_AGENT: ${{ vars.SANDCASTLE_REVIEWER_AGENT }}
          # Provider API keys — only the one matching the active provider is
          # actually read by resolveAgent. Empty values are harmless.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm sandcastle --execute --only=review

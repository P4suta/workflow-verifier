name: build_for_linux

on:
  push:
    branches:
      - master
  workflow_dispatch:


jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_api.txt
    - name: build
      run: |
        pip install pyinstaller
        pyinstaller -F main.py
        mv ./dist/main ./dist/aichat_linux_amd64
    - name: Add config_example.yaml to dist
      run: cp config_example.yaml ./dist/
    - name: Upload artifacts linux_amd64
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: linux_amd64
        path: ./dist

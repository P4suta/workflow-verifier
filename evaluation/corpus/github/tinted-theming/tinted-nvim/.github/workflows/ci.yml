name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Cache Nix store
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: nix-community
          skipPush: true

      - name: Run luacheck
        run: nix develop .#ci --command just lint

      - name: Check formatting
        run: nix develop .#ci --command just fmt-check

      - name: Run lua-language-server check
        run: nix develop .#ci --command just check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Cache Nix store
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: nix-community
          skipPush: true

      - name: Run tests
        run: nix develop .#ci --command just test

      - name: Run parity check
        run: nix develop .#ci --command just verify-parity

  # Ensure generated files are not included in PR since these will be built on merge to main
  check-generated:
    name: Check Generated Files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for changes to generated files
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'lua/tinted-nvim/palettes/*.lua' 'colors/*.vim')
          if [ -n "$CHANGED" ]; then
            echo "::error::Generated files should not be modified in PRs:"
            echo "$CHANGED"
            echo ""
            echo "These files are auto-generated. Please revert changes to:"
            echo "  - lua/tinted-nvim/palettes/*.lua"
            echo "  - colors/*.vim"
            exit 1
          fi

  docs:
    uses: ./.github/workflows/docs.yml
    with:
      trigger_event: "pull_request"

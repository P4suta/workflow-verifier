name: "Check for newer chainguard image versions"

on:
  workflow_dispatch:
  schedule:
    # At the end of every working day
    - cron: "0 17 * * *"

jobs:
  digest-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # Immutable release
        with:
          persist-credentials: false
      - uses: navikt/digestabot@3302a753e533ceb9ec216de7f78345436cd636e3 # v1.2 # Immutable release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          team: pia

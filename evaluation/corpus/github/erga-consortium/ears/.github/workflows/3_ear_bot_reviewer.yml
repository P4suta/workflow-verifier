name: The EARs Reviewing bot for assigning reviewer after supervisor approval

on:
  schedule:
    - cron: "0 9,21 * * *"

  workflow_dispatch:

concurrency:
  group: ear-bot-scheduled
  cancel-in-progress: false

jobs:
  find-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: 917566
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: "ERGA-consortium"
          repositories: "EARs"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "main"
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: |
          uv pip install --system -r ear_bot/requirements.txt

      - name: Run python script to find a reviewer
        env:
          GITHUB_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u ear_bot/ear_bot_reviewer.py --search

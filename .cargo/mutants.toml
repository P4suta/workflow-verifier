# High-value Rust semantic mutation scope. CLI/LSP presentation, OS adapters,
# runtime helper glue, and conformance-tool implementation are intentionally excluded.
examine_globs = [
  "crates/domain/src/**/*.rs",
  "crates/engine/src/**/*.rs",
  "crates/foundation/src/**/*.rs",
  "crates/frontend/src/**/*.rs",
  "crates/product/src/**/*.rs",
  "crates/sandbox/src/**/*.rs",
  "crates/syntax/src/**/*.rs",
  "crates/verifier/src/**/*.rs",
  "helpers/protocol/src/**/*.rs",
]

# `helper_main` is only stdin/stdout/process-exit composition. Its pure argument,
# plan, launch, evidence, and result contracts are mutated below; process wiring
# is covered by CLI transcript tests in `just check`.
exclude_re = ["helper_main"]

# Every mutant is exercised through its owning contracts and downstream
# language-independent report comparator. The slow process/TTY/LSP suites stay
# outside this tier and continue to run in `just check`.
test_package = [
  "workflow-verifier-conformance",
  "workflow-verifier-domain",
  "workflow-verifier-engine",
  "workflow-verifier-foundation",
  "workflow-verifier-frontend",
  "workflow-verifier-product",
  "workflow-verifier-sandbox",
  "workflow-verifier-syntax",
  "workflow-verifier-verifier",
  "workflow-verifier-runner-protocol",
]

profile = "mutants"
test_tool = "cargo"
cap_lints = true

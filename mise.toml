# SPDX-License-Identifier: MIT OR Apache-2.0

[settings]
jobs = 1

[tools]
python = "3.13.7"
rust = "1.98.0"
just = "1.57.0"

[tools.opam]
version = "2.5.2"

[tools.opam.platforms]
windows-x64 = { asset_pattern = "opam-2.5.2-x86_64-windows.exe", bin = "opam.exe" }
linux-x64 = { asset_pattern = "opam-2.5.2-x86_64-linux", bin = "opam" }
linux-arm64 = { asset_pattern = "opam-2.5.2-arm64-linux", bin = "opam" }
macos-x64 = { asset_pattern = "opam-2.5.2-x86_64-macos", bin = "opam" }
macos-arm64 = { asset_pattern = "opam-2.5.2-arm64-macos", bin = "opam" }

[tasks.bootstrap]
description = "Create the project-local OCaml 5.5 switch"
run = "opam init --bare --no-setup --yes && opam switch create . ocaml-base-compiler.5.5.0 --yes && opam install . --deps-only --with-test --locked --yes"

[tasks.build]
description = "Build every OCaml target"
run = "opam exec -- dune build @all"

[tasks.test]
description = "Run executable contracts"
run = "opam exec -- dune runtest --force"

[tasks.property]
description = "Run deterministic property contracts"
run = "opam exec -- dune exec test/property_contract.exe"

[tasks.yaml-conformance]
description = "Run all cases from the explicitly fetched, immutable yaml-test-suite release"
run = "python -B scripts/fetch_yaml_test_suite.py && opam exec -- dune exec test/yaml_conformance.exe -- --suite _build/upstream/yaml-test-suite-data-2022-01-17"

[tasks.fetch-yaml-suite]
description = "Explicitly fetch the pinned MIT yaml-test-suite release"
run = "python -B scripts/fetch_yaml_test_suite.py --allow-network"

[tasks.helpers]
description = "Run native backend conformance"
run = "cargo test --workspace --all-targets --exclude workflow-verifier --exclude workflow-verifier-conformance"

[tasks.helpers-lint]
description = "Enforce native helper formatting and warning-free Clippy"
run = "cargo clippy --workspace --all-targets --exclude workflow-verifier --exclude workflow-verifier-conformance -- -D warnings"

[tasks.rust]
description = "Run the Rust workspace formatting, test, and lint gates"
run = "cargo fmt --all -- --check && cargo test --workspace --all-targets && cargo clippy --workspace --all-targets -- -D warnings"

[tasks.lsp-performance]
description = "Enforce pinned release-mode LSP latency budgets"
run = "cargo test --release -p workflow-verifier --lib lsp::performance_tests -- --ignored --nocapture --test-threads=1"

[tasks.differential]
description = "Compare test-only OCaml and Rust semantic-conformance/1 outcomes"
run = "just differential"

[tasks.tooling]
description = "Run release-tool regression tests"
run = 'python -B -m unittest discover -s scripts/tests -p "test_*.py" -v'

[tasks.fuzz]
description = "Build the AFL-instrumented YAML harness and run a bounded campaign"
run = "opam exec -- dune build --profile afl test/yaml_fuzz.exe && python -B scripts/run_afl_fuzz.py --seeds fuzz/corpus/yaml --output _build/afl-results --target _build/default/test/yaml_fuzz.exe --seconds 60 --memory-mb 1024"

[tasks.mutation-gate]
description = "Verify one complete catalog-bound mutation report"
run = "python -B scripts/verify_mutation_report.py --report _build/mutation-report.json --output _build/mutation-gate-v1.json --require-prefix lib/foundation/ --require-prefix lib/syntax/ --require-prefix lib/domain/ --require-prefix lib/verifier/ --require-prefix lib/product/"

[tasks.mutation-campaign]
description = "Prove that all mutation shard reports exactly cover the canonical catalog"
run = "python -B scripts/verify_mutation_campaign.py aggregate --manifest scripts/mutation-shards-v1.json --config .ocaml-mutants.toml --workspace . --catalog _build/mutation-evidence/mutation-catalog.json --evidence-dir _build/mutation-evidence --output _build/mutation-evidence/mutation-campaign-v1.json"

[tasks.mutation-rust-list]
description = "List the explicit high-value Rust mutation catalog without executing it"
run = "mkdir -p _build && cargo mutants --config .cargo/mutants.toml --package workflow-verifier --list --json > _build/rust-mutants-catalog.json"

[tasks.mutation-rust]
description = "Run high-value Rust mutants for WV_MUTATION_LAYER"
run = 'cargo mutants --config .cargo/mutants.toml --package workflow-verifier --file "src/${WV_MUTATION_LAYER}/**/*.rs" --output ${WV_MUTATION_OUTPUT:-_build/rust-mutants}'

[tasks.mutation-rust-high-value]
description = "Run every configured high-value Rust product mutant"
run = "cargo mutants --config .cargo/mutants.toml --package workflow-verifier --output ${WV_MUTATION_OUTPUT:-_build/rust-mutants-high-value}"

[tasks.corpus]
description = "Enforce the 400-repository release precision and recall gate"
run = "python -B scripts/corpus_gate.py --manifest evaluation/corpus-v1.json --corpus-root evaluation/corpus --reports-root evaluation/reports --output _build/corpus-report-v1.json --release"

[tasks.corpus-acquire]
description = "Explicitly acquire immutable permissively licensed corpus snapshots"
run = "cargo build --locked -p workflow-verifier && python -B scripts/prepare_corpus.py acquire --analyzer target/debug/workflow-verifier --output evaluation --per-provider 100 --pages 10 --workers 8"

[tasks.corpus-refresh]
description = "Reanalyze verified immutable corpus snapshots without network access"
run = "cargo build --locked -p workflow-verifier && python -B scripts/prepare_corpus.py refresh --evaluation evaluation --analyzer target/debug/workflow-verifier --output _build/evaluation-refreshed --workers 8"

[tasks.corpus-review]
description = "Apply exhaustive reviewed diagnostic classifications to the corpus"
run = "python -B scripts/prepare_corpus.py apply-review --manifest evaluation/corpus-v1.json --reports-root evaluation/reports --review evaluation/review-v1.json"

[tasks.official-fetch]
description = "Acquire the eight pinned official CI snapshots without executing them"
run = "python -B scripts/fetch_official_projects.py --manifest official/official-projects-v1.json --destination _build/official-projects --mode pinned"

[tasks.official-compat]
description = "Verify deterministic compatibility with the pinned official projects"
run = "cargo build --locked -p workflow-verifier && python -B scripts/official_compat.py --manifest official/official-projects-v1.json --snapshots _build/official-projects --analyzer target/debug/workflow-verifier --output _build/official-compat-v1.json"

[tasks.performance-measure]
description = "Measure the Rust product scenarios for WV_REVISION"
run = "python -B scripts/measure_performance.py --suite performance/rust-suite-v2.json --workspace . --revision ${WV_REVISION} --samples 7 --output _build/performance-current.json"

[tasks.performance-pair]
description = "Period-balance WV_BASE_REVISION and WV_REVISION on one runner"
run = "python -B scripts/measure_performance_pair.py --suite performance/rust-suite-v2.json --baseline-workspace ${WV_BASE_WORKSPACE} --baseline-revision ${WV_BASE_REVISION} --current-workspace . --current-revision ${WV_REVISION} --samples 24 --output-dir _build/performance-pair"

[tasks.performance-measure-rust]
description = "Build and measure the release Rust CLI for WV_REVISION"
run = "WORKFLOW_VERIFIER_SOURCE_COMMIT=${WV_REVISION} cargo build --locked --release -p workflow-verifier && python -B scripts/measure_performance.py --suite performance/rust-suite-v2.json --workspace . --revision ${WV_REVISION} --samples 7 --output _build/performance-rust-current.json"

[tasks.performance-pair-rust]
description = "Build and period-balance release Rust CLIs for both revisions"
run = "WORKFLOW_VERIFIER_SOURCE_COMMIT=${WV_BASE_REVISION} cargo build --locked --release --manifest-path ${WV_BASE_WORKSPACE}/Cargo.toml --bin workflow-verifier && WORKFLOW_VERIFIER_SOURCE_COMMIT=${WV_REVISION} cargo build --locked --release -p workflow-verifier && python -B scripts/measure_performance_pair.py --suite performance/rust-suite-v2.json --baseline-workspace ${WV_BASE_WORKSPACE} --baseline-revision ${WV_BASE_REVISION} --current-workspace . --current-revision ${WV_REVISION} --samples 24 --output-dir _build/performance-rust-pair"

[tasks.performance-gate]
description = "Reject unexplained performance regressions above ten percent"
run = "python -B scripts/performance_gate.py --baseline performance/baseline.json --current _build/performance-current.json --output _build/performance-comparison-v2.json"

[tasks.determinism-probe]
description = "Generate twice-local report, lockfile, and fix artifacts for this platform"
run = "WORKFLOW_VERIFIER_SOURCE_COMMIT=$(git rev-parse HEAD) cargo build --locked -p workflow-verifier && python -B scripts/determinism_probe.py --analyzer target/debug/workflow-verifier --fixture test/fixtures/determinism --output _build/determinism/local"

[tasks.determinism-compare]
description = "Compare portable bytes and report semantics from all five release platforms"
run = "python -B scripts/compare_determinism.py --output _build/determinism/comparison.json _build/determinism/linux-x86_64 _build/determinism/linux-arm64 _build/determinism/windows-x86_64 _build/determinism/macos-arm64 _build/determinism/macos-x86_64"

[tasks.version]
description = "Verify every development version surface"
run = "python -B scripts/verify_release_version.py --allow-development"

[tasks.sync-release-version]
description = "Synchronize every derived release version from Cargo"
run = "python -B scripts/sync_release_version.py"

[tasks.release-evidence]
description = "Verify two-commit evidence and the signed maintainer attestation"
run = "python -B scripts/verify_release_evidence.py --manifest release-evidence/release-evidence-v4.json --revision ${WV_RELEASE_REVISION} --tag ${WV_RELEASE_TAG} --repository ."

[tasks.candidate-source]
description = "Build commit-bound static source and schema candidate assets twice"
run = "python -B scripts/candidate_artifacts.py source-assets --repository . --subject-commit ${WV_CANDIDATE_COMMIT} --version ${WV_RELEASE_VERSION} --output-dir _candidate/source --fragment _candidate/source/reproducibility-source.json"

[tasks.candidate-reproducibility]
description = "Aggregate all candidate reproducibility fragments into one release gate"
run = "python -B scripts/candidate_artifacts.py aggregate --subject-commit ${WV_CANDIDATE_COMMIT} --output _candidate/reproducible-build.json ${WV_REPRODUCIBILITY_FRAGMENTS}"

[tasks.architecture]
description = "Enforce the one-way OCaml and Rust module graphs"
run = "python -B scripts/verify_architecture.py"

[tasks.lint-policy]
description = "Reject first-party Rust lint suppression escapes"
run = "python -B scripts/verify_lint_policy.py"

[tasks.purity]
description = "Prove the analyzer dependency and source boundary"
run = "python -B scripts/verify_pure_ocaml.py"

[tasks.licenses]
description = "Verify complete dual-license texts and aligned SPDX surfaces"
run = "python -B scripts/verify_licenses.py"

[tasks.install-check]
description = "Verify the intentionally narrow install surface"
run = "opam exec -- dune build @install && cargo build -p workflow-verifier && python -B scripts/verify_install_layout.py _build/install/default target/debug/workflow-verifier"

[tasks.task-surface]
description = "Verify the pinned Just parser and aligned Just/mise task names"
run = "python -B scripts/verify_task_surface.py"

[tasks.conformance-manifest]
description = "Verify content-addressed language-independent vectors"
run = "python -B scripts/verify_conformance_manifest.py --manifest conformance/manifest-v2.json --root ."

[tasks.links]
description = "Verify local Markdown links without network access"
run = "python -B scripts/verify_markdown_links.py --root ."

[tasks.sbom]
description = "Generate per-payload SPDX and aggregate CycloneDX SBOMs"
run = "python -B scripts/generate_sbom.py --version ${WV_RELEASE_VERSION} --dependency-manifest release/sbom-components-v1.json --output-dir dist/sbom --cyclonedx dist/workflow-verifier.cdx.json --checksums dist/SBOM-SHA256SUMS ${WV_RELEASE_ARTIFACTS}"

[tasks.linux-compat]
description = "Enforce the glibc 2.28 and ELF dependency floor for WV_LINUX_BINARY"
run = "python -B scripts/verify_linux_compat.py ${WV_LINUX_BINARY}"

[tasks.check]
description = "Run the local release-readiness sequence"
depends = ["task-surface", "conformance-manifest", "build", "test", "yaml-conformance", "tooling", "architecture", "lint-policy", "rust", "lsp-performance", "differential", "purity", "licenses", "install-check"]

[tasks.dogfood]
description = "Analyze workflow-verifier with its own audit persona"
run = "cargo build --locked -p workflow-verifier && target/debug/workflow-verifier check --config examples/dogfood-policy-v2.toml --trust-repository-config ."

[tasks.dogfood-gate]
description = "Verify complete static CLI and live OCI dogfood evidence"
run = "python -B scripts/dogfood_gate.py verify --root _dogfood --output _build/dogfood-v1.json"
